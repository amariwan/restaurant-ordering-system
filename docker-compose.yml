version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: Host=postgres;Database=restaurant;Username=postgres;Password=secret
      JWT_SECRET: dev-secret-minimum-32-characters-long!!
      JWT_EXPIRY_HOURS: 8
      CORS_ORIGINS: http://localhost:3000
      # If you run docker-compose, MinIO will be available as a service below.
      # These can be overridden in an env file or when running docker-compose.
      # MINIO settings will make the backend use MinIO as S3-compatible storage.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: restaurant-images
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SIGNALR_URL: http://localhost:5000/hubs
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
