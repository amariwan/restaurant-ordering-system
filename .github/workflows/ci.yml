name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - run: dotnet restore RestaurantApp.sln
      - run: dotnet build RestaurantApp.sln --no-restore -c Release
      - run: dotnet test RestaurantApp.Tests --no-restore --no-build -c Release
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

  frontend:
    name: Frontend (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:strict

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
